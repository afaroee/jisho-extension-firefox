<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E83B3B"/>
      <stop offset="100%" stop-color="#B81A1A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle inner lens accent -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="86" cy="42" r="16" fill="rgba(255,255,255,0.08)"/>

  <!-- Stylized Kanji '辞' (Jisho / Word) -->
  <text x="64" y="85" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif" font-weight="900" font-size="68" fill="#FFFFFF" text-anchor="middle">辞</text>

  <!-- Modern Accent Dot -->
  <circle cx="98" cy="98" r="6" fill="#FDE047"/>
</svg>
